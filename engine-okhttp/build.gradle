plugins {
    // java-library: exposes the core SPI and the transport in the api configuration
    id 'java-library'
    id 'maven-publish'
}

group = 'ru.jrestly'
version = '0.10.0'

repositories {
    mavenCentral()
}

dependencies {
    // api: the engine implements core SPI types in its public surface
    api project(':')
    // api: public constructors/factories accept OkHttpClient (ADR-0058)
    api 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.12.1'
}

java {
    withSourcesJar()
    withJavadocJar()
}

compileJava {
    options.release = 21
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all'
    options.compilerArgs << '-Werror'
}

compileTestJava {
    options.release = 21
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all'
    options.compilerArgs << '-Werror'
}

javadoc {
    options.addStringOption('Xdoclint:all')
    options.addBooleanOption('Werror', true)
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'ru.jrestly.engine.okhttp'
        )
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'jrestly-engine-okhttp'
            pom {
                name = 'jRestly Engine: OkHttp'
                description = 'OkHttp transport engine for jRestly: plugs jRestly onto OkHttp via the HttpEngine SPI (ADR-0058).'
                url = 'https://github.com/longirun/jRestly'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'longirun'
                        name = 'Anton Sinyagovsky'
                        email = 'sinyagovsky@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/longirun/jRestly.git'
                    developerConnection = 'scm:git:ssh://github.com/longirun/jRestly.git'
                    url = 'https://github.com/longirun/jRestly'
                }
            }
        }
    }
}
