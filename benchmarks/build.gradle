plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':')
    // ADR-0058 phase 2: the external transports are published submodules
    implementation project(':engine-okhttp')
    implementation project(':engine-apache5')

    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'io.github.openfeign:feign-core:13.5'
    implementation 'io.github.openfeign:feign-jackson:13.5'
    implementation 'io.github.openfeign:feign-java11:13.5'

    implementation 'org.springframework:spring-web:6.2.2'
    implementation 'org.springframework:spring-context:6.2.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileJava {
    options.release = 21
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.release = 21
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

javadoc {
    enabled = false
}

tasks.register('jmh', JavaExec) {
    description = 'Execute JMH performance benchmarks'
    group = 'benchmark'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'

    def jmhArgs = project.hasProperty('jmhArgs') ? (project.property('jmhArgs').toString().trim().split('\\s+') as List) : []
    if (jmhArgs.isEmpty()) {
        args = ['-f', '1', '-wi', '2', '-i', '3', '-tu', 'us', '-bm', 'avgt']
    } else {
        args = jmhArgs
    }
}
