plugins {
    id 'java'
    id 'maven-publish'
}

group = 'ru.jrestly'
version = '0.4.0-rc2'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.12.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

compileJava {
    options.compilerArgs << '-parameters'
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'ru.jrestly'
        )
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'jRestly'
                description = 'A declarative HTTP client for Java: define an interface, get a working HTTP client via a dynamic proxy.'
                url = 'https://github.com/longirun/jRestly'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'longirun'
                        name = 'Anton Sinyagovsky'
                        email = 'sinyagovsky@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/longirun/jRestly.git'
                    developerConnection = 'scm:git:ssh://github.com/longirun/jRestly.git'
                    url = 'https://github.com/longirun/jRestly'
                }
            }
        }
    }
}
