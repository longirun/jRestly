plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
}

group = 'ru.jrestly'
version = '0.12.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    compileOnly 'com.google.code.gson:gson:2.14.0'
    compileOnly 'com.squareup.moshi:moshi:1.15.2'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'com.squareup.moshi:moshi:1.15.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.12.1'

    // main code logs via System.Logger; the log4j backend stays a test-runtime concern
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.24.1'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-jul:2.24.1'
}

java {
    withSourcesJar()
    withJavadocJar()
}

compileJava {
    options.release = 21
    options.compilerArgs << '-parameters'
    // ADR-0013 follow-up: -Xlint:all gate (a deliberate separate decision) —
    // the tree is 0/0 and the audit's suppressions carry one-line rationales,
    // so -Werror forgives them; any new warning fails the build
    options.compilerArgs << '-Xlint:all'
    options.compilerArgs << '-Werror'
}

compileTestJava {
    options.release = 21
    // @PathVariable name-fallback reads parameter names; tests exercise that branch too
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all'
    options.compilerArgs << '-Werror'
}

javadoc {
    // ADR-0013 D2: doclint gate — a public/protected member without a comment fails the build;
    // single-argument form (two arguments make javadoc read the bare 'all' as a package)
    options.addStringOption('Xdoclint:all')
    options.addBooleanOption('Werror', true)
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'ru.jrestly'
        )
    }
}

jacoco {
    toolVersion = "0.8.12"
}

test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'org.apache.logging.log4j.jul.LogManager'
    // Structural allocation tests reflect into JDK collection internals
    // (e.g. the backing-list field of Collections unmodifiable wrappers).
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'jRestly'
                description = 'A declarative HTTP client for Java: define an interface, get a working HTTP client via a dynamic proxy.'
                url = 'https://github.com/longirun/jRestly'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'longirun'
                        name = 'Anton Sinyagovsky'
                        email = 'sinyagovsky@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/longirun/jRestly.git'
                    developerConnection = 'scm:git:ssh://github.com/longirun/jRestly.git'
                    url = 'https://github.com/longirun/jRestly'
                }
            }
        }
    }
}
